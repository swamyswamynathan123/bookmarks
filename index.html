<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bookmarks</title>
<style>
:root {
  --bg: #f5f7fb;
  --surface: #ffffff;
  --surface-2: #f0f4fa;
  --border: #e3e8f0;
  --text: #0f172a;
  --muted: #64748b;
  --primary: #2563eb;
  --primary-hover: #1d4ed8;
  --primary-soft: #dbeafe;
  --danger: #dc2626;
  --shadow: 0 1px 2px rgba(15, 23, 42, .06), 0 4px 12px rgba(15, 23, 42, .05);
  --radius: 12px;
  --radius-sm: 8px;
}
[data-theme="dark"] {
  --bg: #0b1220;
  --surface: #131b2d;
  --surface-2: #1a2540;
  --border: #283353;
  --text: #e6ecf7;
  --muted: #94a3b8;
  --primary: #3b82f6;
  --primary-hover: #60a5fa;
  --primary-soft: #1e3a8a;
  --danger: #f87171;
  --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 8px 24px rgba(0, 0, 0, .35);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 1200px; margin: 0 auto; padding: 24px 20px 64px; }
header.top {
  display: flex; align-items: center; justify-content: space-between;
  gap: 16px; margin-bottom: 20px;
}
header.top h1 {
  margin: 0; font-size: 26px; letter-spacing: -.01em;
  display: flex; align-items: center; gap: 10px;
}
.brand-dot {
  width: 28px; height: 28px; border-radius: 8px;
  background: linear-gradient(135deg, var(--primary), #60a5fa);
  box-shadow: 0 4px 12px rgba(37, 99, 235, .35);
}
.icon-btn {
  background: var(--surface); border: 1px solid var(--border); color: var(--text);
  width: 40px; height: 40px; border-radius: 10px; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center;
  transition: background .15s, border-color .15s, transform .05s;
}
.icon-btn:hover { background: var(--surface-2); border-color: var(--primary); }
.icon-btn:active { transform: translateY(1px); }
.icon-btn svg { width: 18px; height: 18px; }
.controls { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
.search { flex: 1 1 280px; position: relative; }
.search input {
  width: 100%; padding: 12px 14px 12px 42px;
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  background: var(--surface); color: var(--text);
  font-size: 15px; outline: none;
  transition: border-color .15s, box-shadow .15s;
}
.search input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
.search svg {
  position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
  width: 18px; height: 18px; color: var(--muted);
}
.btn-primary {
  background: var(--primary); color: white; border: none;
  padding: 0 18px; height: 44px; border-radius: var(--radius-sm);
  font-size: 15px; font-weight: 600; cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px;
  transition: background .15s, transform .05s; white-space: nowrap;
}
.btn-primary:hover { background: var(--primary-hover); }
.btn-primary:active { transform: translateY(1px); }
.categories { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 22px; }
.chip {
  background: var(--surface); border: 1px solid var(--border); color: var(--text);
  padding: 8px 14px; border-radius: 999px; font-size: 14px; cursor: pointer;
  transition: background .15s, border-color .15s, color .15s;
}
.chip:hover { border-color: var(--primary); }
.chip.active { background: var(--primary); border-color: var(--primary); color: white; }
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 16px;
}
.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 16px;
  box-shadow: var(--shadow);
  display: flex; flex-direction: column; gap: 10px;
  transition: transform .12s, box-shadow .12s, border-color .12s;
}
.card:hover {
  transform: translateY(-2px); border-color: var(--primary);
  box-shadow: 0 4px 8px rgba(15, 23, 42, .08), 0 12px 24px rgba(15, 23, 42, .08);
}
.card-head { display: flex; align-items: center; gap: 10px; }
.favicon {
  width: 32px; height: 32px; border-radius: 8px;
  background: var(--surface-2);
  display: inline-flex; align-items: center; justify-content: center;
  overflow: hidden; flex-shrink: 0;
  font-weight: 700; color: var(--primary); font-size: 14px;
}
.favicon img { width: 100%; height: 100%; object-fit: contain; }
.card-title {
  font-weight: 600; font-size: 15px; color: var(--text);
  text-decoration: none; flex: 1;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.card-title:hover { color: var(--primary); }
.card-url {
  font-size: 12px; color: var(--muted);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.card-notes {
  font-size: 13px; color: var(--muted); margin: 0;
  display: -webkit-box; -webkit-line-clamp: 3;
  -webkit-box-orient: vertical; overflow: hidden;
}
.card-foot {
  display: flex; align-items: center; justify-content: space-between;
  margin-top: auto; padding-top: 8px;
}
.badge {
  display: inline-block; background: var(--primary-soft); color: var(--primary);
  padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600;
}
[data-theme="dark"] .badge { color: #bfdbfe; }
.card-actions { display: flex; gap: 4px; }
.card-actions button {
  background: transparent; border: none; color: var(--muted);
  width: 32px; height: 32px; border-radius: 6px; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center;
  transition: background .15s, color .15s;
}
.card-actions button:hover { background: var(--surface-2); color: var(--text); }
.card-actions .del:hover { color: var(--danger); }
.card-actions svg { width: 16px; height: 16px; }
.empty { text-align: center; padding: 60px 20px; color: var(--muted); }
.empty h3 { color: var(--text); margin: 0 0 6px; }
dialog#modal {
  border: none; padding: 0; border-radius: 16px;
  background: var(--surface); color: var(--text);
  box-shadow: 0 20px 60px rgba(0, 0, 0, .3);
  width: min(480px, calc(100% - 32px)); max-width: 480px;
}
dialog#modal::backdrop {
  background: rgba(15, 23, 42, .5);
  backdrop-filter: blur(4px);
}
.modal-body { padding: 24px; }
.modal-body h2 { margin: 0 0 18px; font-size: 20px; }
.field { margin-bottom: 14px; }
.field label {
  display: block; font-size: 13px; font-weight: 600;
  margin-bottom: 6px; color: var(--text);
}
.field input, .field select, .field textarea {
  width: 100%; padding: 10px 12px;
  border: 1px solid var(--border); border-radius: 8px;
  background: var(--surface); color: var(--text);
  font-size: 14px; font-family: inherit; outline: none;
  transition: border-color .15s, box-shadow .15s;
}
.field input:focus, .field select:focus, .field textarea:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px var(--primary-soft);
}
.field textarea { resize: vertical; min-height: 70px; }
.modal-foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
.btn-secondary {
  background: transparent; border: 1px solid var(--border); color: var(--text);
  padding: 0 16px; height: 40px; border-radius: 8px;
  cursor: pointer; font-size: 14px; font-weight: 500;
}
.btn-secondary:hover { background: var(--surface-2); }
.modal-foot .btn-primary { height: 40px; }
@media (max-width: 520px) {
  .wrap { padding: 16px 14px 48px; }
  header.top h1 { font-size: 22px; }
  .grid { grid-template-columns: 1fr; }
  .btn-primary { width: 100%; justify-content: center; }
  .search { flex-basis: 100%; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1><span class="brand-dot"></span>Bookmarks</h1>
    <button id="theme-toggle" class="icon-btn" aria-label="Toggle dark mode" title="Toggle dark mode">
      <svg id="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
      </svg>
    </button>
  </header>
  <section class="controls">
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="7"/>
        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input id="search" type="search" placeholder="Search by title or category...">
    </div>
    <button id="add-btn" class="btn-primary">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px">
        <line x1="12" y1="5" x2="12" y2="19"/>
        <line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
      Add Bookmark
    </button>
  </section>
  <nav id="categories" class="categories"></nav>
  <main id="grid" class="grid"></main>
  <div id="empty" class="empty" hidden>
    <h3>No bookmarks here yet</h3>
    <p>Try a different search or category, or add a new one.</p>
  </div>
</div>
<dialog id="modal">
  <form id="form" class="modal-body" method="dialog">
    <h2 id="modal-title">Add Bookmark</h2>
    <div class="field">
      <label for="f-title">Title</label>
      <input id="f-title" name="title" type="text" required maxlength="200" placeholder="e.g. MDN Web Docs">
    </div>
    <div class="field">
      <label for="f-url">URL</label>
      <input id="f-url" name="url" type="url" required placeholder="https://example.com">
    </div>
    <div class="field">
      <label for="f-category">Category</label>
      <select id="f-category" name="category" required>
        <option value="Learning">Learning</option>
        <option value="Personal">Personal</option>
        <option value="Books">Books</option>
        <option value="Shopping">Shopping</option>
        <option value="Entertainment">Entertainment</option>
        <option value="Other">Other</option>
      </select>
    </div>
    <div class="field">
      <label for="f-notes">Notes <span style="color:var(--muted);font-weight:400">(optional)</span></label>
      <textarea id="f-notes" name="notes" maxlength="500" placeholder="Anything worth remembering..."></textarea>
    </div>
    <div class="modal-foot">
      <button type="button" id="cancel-btn" class="btn-secondary">Cancel</button>
      <button type="submit" id="save-btn" class="btn-primary">Save</button>
    </div>
  </form>
</dialog>
<script>
const STORAGE_KEY = "bookmarks_v1";
const THEME_KEY = "theme_v1";
const CATEGORIES = ["Learning", "Personal", "Books", "Shopping", "Entertainment", "Other"];

const SAMPLES = [
  { title: "MDN Web Docs", url: "https://developer.mozilla.org", category: "Learning", notes: "The definitive reference for web standards." },
  { title: "freeCodeCamp", url: "https://www.freecodecamp.org", category: "Learning", notes: "Free coding tutorials and certifications." },
  { title: "GitHub", url: "https://github.com", category: "Personal", notes: "" },
  { title: "Goodreads", url: "https://www.goodreads.com", category: "Books", notes: "Track what you read and find recommendations." },
  { title: "Project Gutenberg", url: "https://www.gutenberg.org", category: "Books", notes: "60,000+ free ebooks in the public domain." },
  { title: "Amazon", url: "https://www.amazon.com", category: "Shopping", notes: "" },
  { title: "YouTube", url: "https://www.youtube.com", category: "Entertainment", notes: "" },
  { title: "Netflix", url: "https://www.netflix.com", category: "Entertainment", notes: "" }
];

let bookmarks = [];
let activeCategory = "All";
let searchTerm = "";
let editingId = null;

const qs = (sel) => document.querySelector(sel);
const gridEl = qs("#grid");
const emptyEl = qs("#empty");
const categoriesEl = qs("#categories");
const searchEl = qs("#search");
const modal = qs("#modal");
const form = qs("#form");
const modalTitle = qs("#modal-title");

const SUN_SVG = `<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>`;
const MOON_SVG = `<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>`;
const EDIT_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>`;
const DEL_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/></svg>`;

function loadTheme() {
  const t = localStorage.getItem(THEME_KEY) || "light";
  document.documentElement.setAttribute("data-theme", t);
  updateThemeIcon(t);
}
function toggleTheme() {
  const cur = document.documentElement.getAttribute("data-theme");
  const next = cur === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  localStorage.setItem(THEME_KEY, next);
  updateThemeIcon(next);
}
function updateThemeIcon(theme) {
  qs("#theme-icon").innerHTML = theme === "dark" ? MOON_SVG : SUN_SVG;
}

function load() {
  const raw = localStorage.getItem(STORAGE_KEY);
  if (raw === null) {
    bookmarks = SAMPLES.map((s) => Object.assign({}, s, { id: uid(), createdAt: Date.now() }));
    save();
  } else {
    try { bookmarks = JSON.parse(raw) || []; }
    catch (e) { bookmarks = []; }
  }
}
function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(bookmarks));
}
function uid() {
  return (crypto && crypto.randomUUID) ? crypto.randomUUID() : "id-" + Math.random().toString(36).slice(2) + Date.now();
}

function renderCategories() {
  const all = ["All"].concat(CATEGORIES);
  categoriesEl.innerHTML = "";
  for (const cat of all) {
    const b = document.createElement("button");
    b.className = "chip" + (cat === activeCategory ? " active" : "");
    b.textContent = cat;
    b.addEventListener("click", () => {
      activeCategory = cat;
      renderCategories();
      renderGrid();
    });
    categoriesEl.appendChild(b);
  }
}

function getVisible() {
  const q = searchTerm.trim().toLowerCase();
  return bookmarks.filter((b) => {
    if (activeCategory !== "All" && b.category !== activeCategory) return false;
    if (!q) return true;
    return b.title.toLowerCase().includes(q) || b.category.toLowerCase().includes(q);
  });
}

function hostOf(url) {
  try { return new URL(url).hostname; } catch (e) { return ""; }
}
function faviconUrl(url) {
  const h = hostOf(url);
  return h ? "https://www.google.com/s2/favicons?domain=" + encodeURIComponent(h) + "&sz=64" : "";
}

function buildCard(b) {
  const card = document.createElement("article");
  card.className = "card";

  const head = document.createElement("div");
  head.className = "card-head";
  const favBox = document.createElement("div");
  favBox.className = "favicon";
  const letter = (b.title.trim().charAt(0) || "?").toUpperCase();
  const fav = faviconUrl(b.url);
  if (fav) {
    const img = document.createElement("img");
    img.alt = "";
    img.src = fav;
    img.onerror = () => { favBox.textContent = letter; };
    favBox.appendChild(img);
  } else {
    favBox.textContent = letter;
  }
  const titleLink = document.createElement("a");
  titleLink.className = "card-title";
  titleLink.href = b.url;
  titleLink.target = "_blank";
  titleLink.rel = "noopener noreferrer";
  titleLink.title = b.title;
  titleLink.textContent = b.title;
  head.appendChild(favBox);
  head.appendChild(titleLink);

  const urlDiv = document.createElement("div");
  urlDiv.className = "card-url";
  urlDiv.title = b.url;
  urlDiv.textContent = b.url;

  card.appendChild(head);
  card.appendChild(urlDiv);

  if (b.notes) {
    const p = document.createElement("p");
    p.className = "card-notes";
    p.textContent = b.notes;
    card.appendChild(p);
  }

  const foot = document.createElement("div");
  foot.className = "card-foot";
  const badge = document.createElement("span");
  badge.className = "badge";
  badge.textContent = b.category;
  const actions = document.createElement("div");
  actions.className = "card-actions";
  const editBtn = document.createElement("button");
  editBtn.className = "edit";
  editBtn.title = "Edit";
  editBtn.setAttribute("aria-label", "Edit bookmark");
  editBtn.innerHTML = EDIT_SVG;
  editBtn.addEventListener("click", () => openEdit(b.id));
  const delBtn = document.createElement("button");
  delBtn.className = "del";
  delBtn.title = "Delete";
  delBtn.setAttribute("aria-label", "Delete bookmark");
  delBtn.innerHTML = DEL_SVG;
  delBtn.addEventListener("click", () => doDelete(b.id));
  actions.appendChild(editBtn);
  actions.appendChild(delBtn);
  foot.appendChild(badge);
  foot.appendChild(actions);
  card.appendChild(foot);

  return card;
}

function renderGrid() {
  const list = getVisible();
  gridEl.innerHTML = "";
  if (list.length === 0) {
    emptyEl.hidden = false;
    return;
  }
  emptyEl.hidden = true;
  const frag = document.createDocumentFragment();
  for (const b of list) frag.appendChild(buildCard(b));
  gridEl.appendChild(frag);
}

function openAdd() {
  editingId = null;
  modalTitle.textContent = "Add Bookmark";
  form.reset();
  qs("#f-category").value = "Learning";
  modal.showModal();
  setTimeout(() => qs("#f-title").focus(), 0);
}
function openEdit(id) {
  const b = bookmarks.find((x) => x.id === id);
  if (!b) return;
  editingId = id;
  modalTitle.textContent = "Edit Bookmark";
  qs("#f-title").value = b.title;
  qs("#f-url").value = b.url;
  qs("#f-category").value = b.category;
  qs("#f-notes").value = b.notes || "";
  modal.showModal();
  setTimeout(() => qs("#f-title").focus(), 0);
}
function doDelete(id) {
  if (!confirm("Delete this bookmark?")) return;
  bookmarks = bookmarks.filter((b) => b.id !== id);
  save();
  renderGrid();
}
function handleSubmit(e) {
  e.preventDefault();
  const title = qs("#f-title").value.trim();
  const url = qs("#f-url").value.trim();
  const category = qs("#f-category").value;
  const notes = qs("#f-notes").value.trim();
  if (!title || !url) return;
  if (editingId) {
    const i = bookmarks.findIndex((b) => b.id === editingId);
    if (i >= 0) bookmarks[i] = Object.assign({}, bookmarks[i], { title: title, url: url, category: category, notes: notes });
  } else {
    bookmarks.unshift({ id: uid(), title: title, url: url, category: category, notes: notes, createdAt: Date.now() });
  }
  save();
  modal.close();
  renderGrid();
}

qs("#theme-toggle").addEventListener("click", toggleTheme);
qs("#add-btn").addEventListener("click", openAdd);
qs("#cancel-btn").addEventListener("click", () => modal.close());
form.addEventListener("submit", handleSubmit);
searchEl.addEventListener("input", (e) => {
  searchTerm = e.target.value;
  renderGrid();
});

loadTheme();
load();
renderCategories();
renderGrid();
</script>
</body>
</html>
